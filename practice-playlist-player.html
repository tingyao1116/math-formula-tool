    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <style>
      /* ── 日程型月曆 ────────────────────────────────── */
      .calendar-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .calendar-nav span {
        font-weight: 600;
        font-size: 1rem;
        flex: 1;
        text-align: center;
      }
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        text-align: center;
        font-size: 0.8rem;
        margin-bottom: 0.5rem;
      }
      .cal-header {
        font-weight: 600;
        color: var(--color-text-muted, #888);
        padding: 3px 0;
      }
      .cal-day {
        padding: 4px 2px;
        border-radius: 4px;
        cursor: default;
        line-height: 22px;
        min-height: 22px;
      }
      .cal-day.has-task {
        background: var(--color-panel-alt, #e8f4f5);
        color: var(--color-accent, #0d5c63);
        font-weight: 600;
        cursor: pointer;
      }
      .cal-day.has-task:hover {
        background: var(--color-accent, #0d5c63);
        color: #fff;
      }
      .cal-day.is-selected {
        background: var(--color-accent, #0d5c63) !important;
        color: #fff !important;
        font-weight: 700;
      }
      .cal-day.is-today {
        outline: 2px solid var(--color-accent, #0d5c63);
        outline-offset: -2px;
      }
      .cal-day.other-month {
        opacity: 0.25;
      }
      /* 完成進度色 */
      .cal-day.has-task.day-done {
        background: var(--color-success-pale, #e8f5e9);
        color: #2e7d32;
        font-weight: 700;
      }
      .cal-day.has-task.day-done::after {
        content: "✓";
        display: block;
        font-size: 0.6rem;
        line-height: 1;
        margin-top: -2px;
      }
      .cal-day.has-task.day-partial {
        background: #fff3e0;
        color: #e65100;
      }
      /* 練習列表完成標記 */
      .practice-done-badge {
        display: inline-block;
        background: #2e7d32;
        color: #fff;
        border-radius: 3px;
        padding: 0 4px;
        font-size: 0.75rem;
        margin-left: 4px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="playlist-page">
    <div class="page-shell">
      <header class="hero">
        <div class="hero__content">
          <p class="eyebrow">Practice Playlist Player</p>
          <h1>無限練習清單播放頁</h1>
          <p class="hero__lead">學生頁只讀老師選好的題型清單，不再看到全部題庫。</p>
          <div class="hero__quicklinks">
            <a class="ghost-link" href="index.html">首頁</a>
            <a class="ghost-link" href="practice-playlist-builder.html">回編輯頁</a>
            <a class="ghost-link" href="practice-quiz.html">開啟測驗頁</a>
          </div>
        </div>
        <div class="hero__panel">
          <h2>目前狀態</h2>
          <ul>
            <li>先支援讀取已存 playlist。</li>
            <li>先顯示選到哪些題型與基本資訊。</li>
            <li>下一步再把完整連續練習流程接上。</li>
          </ul>
        </div>
      </header>

      <main class="layout playlist-layout">
        <aside class="sidebar">

          <!-- 年級篩選 -->
          <section class="panel">
            <h2>選擇年級</h2>
            <label class="field">
              <span>年級</span>
              <select id="playerGradeSelect"></select>
            </label>
            <label class="field">
              <span>清單分類</span>
              <select id="playerCategorySelect">
                <option value="全部">全部清單</option>
                <option value="複習必做">複習必做</option>
                <option value="章節重點">章節重點</option>
                <option value="其他">其他 / 自訂</option>
              </select>
            </label>
          </section>

          <!-- 任務型清單 -->
          <section class="panel">
            <h2>第一類：任務型</h2>
            <div id="taskPlaylistList" class="playlist-player-list"></div>
          </section>

          <!-- 日程型清單 -->
          <section class="panel">
            <h2>第二類：日程型</h2>
            <div id="schedulePlaylistList" class="playlist-player-list"></div>
          </section>

          <!-- 日程型月曆（日程型清單選取時顯示） -->
          <section class="panel" id="scheduleCalendarSection" hidden>
            <h2>月曆選擇日期</h2>
            <div class="calendar-nav">
              <button id="calPrevMonth" class="ghost-button" type="button">◀</button>
              <span id="calMonthLabel"></span>
              <button id="calNextMonth" class="ghost-button" type="button">▶</button>
            </div>
            <div id="calGrid" class="calendar-grid"></div>
            <p id="calDayLabel" class="detail-note">點選有任務的日期開始練習</p>
          </section>

          <!-- 匯入 -->
          <section class="panel">
            <h2>匯入清單</h2>
            <label class="ghost-button playlist-upload-button">
              匯入 JSON（自動儲存）
              <input id="playerImportInput" type="file" accept="application/json" hidden />
            </label>
            <p id="playerImportStatus" class="detail-note"></p>
          </section>

          <!-- 題型列表 -->
          <section class="panel">
            <div class="skill-tree-toolbar">
              <h2>清單題型</h2>
              <span id="playlistPlayerPracticeCount" class="meta-chip"></span>
            </div>
            <div id="playlistPlayerPracticeList" class="playlist-player-list"></div>
          </section>
        </aside>

        <section class="content">
          <section class="panel">
            <div class="summary-panel">
              <div>
                <p class="summary-label">目前清單</p>
                <h2 id="playlistPlayerTitle">尚未選擇</h2>
              </div>
              <p id="playlistPlayerMeta" class="summary-count"></p>
            </div>
            <p id="playlistPlayerDescription" class="detail-note"></p>
            <p id="playlistPlayerStatus" class="detail-note">請先從左側選擇一份清單。</p>
          </section>

          <section class="panel">
            <div class="ability-session-panel__header">
              <div>
                <h2>目前題目</h2>
                <p id="playlistPlayerHint" class="detail-note">先選左側題型，再按出題。</p>
              </div>
              <div class="ability-session-actions playlist-player-toolbar">
                <button id="playlistPrevPracticeButton" class="ghost-button" type="button">上一題型</button>
                <button id="playlistNextPracticeButton" class="ghost-button" type="button">下一題型</button>
                <button id="playlistGenerateButton" class="ghost-button" type="button">重新出題</button>
              </div>
            </div>

            <div id="playlistPlayerCard" class="ability-session-card is-empty">
              <p>這裡會顯示目前題型抽出的題目。</p>
            </div>

            <div id="playlistPlayerAnswerPanel" class="ability-feedback-panel" hidden></div>
          </section>
        </section>
      </main>
    </div>
