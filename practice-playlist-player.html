<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d5c63" />
    <title>無限練習清單播放頁</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Kurenaido&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css?v=20260627-playlist-v1" />
  </head>
  <body class="playlist-page">
    <div class="page-shell">
      <header class="hero">
        <div class="hero__content">
          <p class="eyebrow">Practice Playlist Player</p>
          <h1>無限練習清單播放頁</h1>
          <p class="hero__lead">學生頁只讀老師選好的題型清單，不再看到全部題庫。</p>
          <div class="hero__quicklinks">
            <a class="ghost-link" href="index.html">首頁</a>
            <a class="ghost-link" href="practice-playlist-builder.html">回編輯頁</a>
          </div>
        </div>
        <div class="hero__panel">
          <h2>目前狀態</h2>
          <ul>
            <li>先支援讀取已存 playlist。</li>
            <li>先顯示選到哪些題型與基本資訊。</li>
            <li>下一步再把完整連續練習流程接上。</li>
          </ul>
        </div>
      </header>

      <main class="layout playlist-layout">
        <aside class="sidebar">
          <section class="panel">
            <h2>選擇清單</h2>
            <label class="field">
              <span>已存 playlist</span>
              <select id="playlistPlayerSelect"></select>
            </label>
            <p id="playlistPlayerStatus" class="detail-note">請先選擇一份清單。</p>
          </section>

          <section class="panel">
            <div class="skill-tree-toolbar">
              <h2>清單題型</h2>
              <span id="playlistPlayerPracticeCount" class="meta-chip"></span>
            </div>
            <div id="playlistPlayerPracticeList" class="playlist-player-list"></div>
          </section>
        </aside>

        <section class="content">
          <section class="panel">
            <div class="summary-panel">
              <div>
                <p class="summary-label">目前清單</p>
                <h2 id="playlistPlayerTitle">尚未選擇</h2>
              </div>
              <p id="playlistPlayerMeta" class="summary-count"></p>
            </div>
            <p id="playlistPlayerDescription" class="detail-note"></p>
          </section>

          <section class="panel">
            <div class="ability-session-panel__header">
              <div>
                <h2>目前題目</h2>
                <p id="playlistPlayerHint" class="detail-note">先選左側題型，再按出題。</p>
              </div>
              <div class="ability-session-actions playlist-player-toolbar">
                <button id="playlistPrevPracticeButton" class="ghost-button" type="button">上一題型</button>
                <button id="playlistNextPracticeButton" class="ghost-button" type="button">下一題型</button>
                <button id="playlistGenerateButton" class="ghost-button" type="button">重新出題</button>
              </div>
            </div>

            <div id="playlistPlayerCard" class="ability-session-card is-empty">
              <p>這裡會顯示目前題型抽出的題目。</p>
            </div>

            <div id="playlistPlayerAnswerPanel" class="ability-feedback-panel" hidden></div>
          </section>
        </section>
      </main>
    </div>

    <script defer src="formulas.js"></script>
    <script defer src="data/formula-content.js?v=20260423-abs-count-layout-v4"></script>
    <script defer src="data/question-content.js?v=20260424-question-bridge-v1"></script>

    <script defer src="data/practice-generator-bundles.js?v=20260624-nullfix-v1"></script>
    <script defer src="data/practice-generator-loader.js?v=20260619-e5-force-bundle-v3"></script>
    <script defer src="data/practice-generators/e5.js?v=20260619-e5-fingerprint-v5"></script>
    <script defer src="data/practice-generators/e6.js?v=20260619-e6-real-bundle-v1"></script>
    <script defer src="data/practice-generators/j1.js?v=20260619-j1-chapter-owned-v2"></script>

    <script defer src="data/practice-generators/j6.js?v=20260619-j6-real-bundle-v1"></script>
    <script defer src="data/practice-generators/s1.js?v=20260619-s1-real-bundle-v1"></script>
    <script defer src="data/practice-generators/s2.js?v=20260619-s2-real-bundle-v1"></script>
    <script defer src="data/practice-generators/s3.js?v=20260619-s3-real-bundle-v1"></script>
    <script defer src="data/practice-generators/s4.js?v=20260624-s4-trycatch-v1"></script>
    <script defer src="formula-data.js?v=20260616-e425-split-v1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="formula-core.js?v=20260619-e5-fingerprint-v5"></script>
    <script defer src="practice-playlist/practice-playlist-store.js?v=20260627-playlist-v1"></script>

    <script defer src="pwa.js"></script>
  </body>
