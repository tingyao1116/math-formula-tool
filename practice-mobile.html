<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d5c63" />
    <title>手機無限練習</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Kurenaido&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="styles.css?v=20260621-mobile-student-clean-v1" />
  </head>
  <body>
    <div class="page-shell practice-mobile-page">
      <main class="practice-mobile-layout">
        <section id="mobileChapterSelectView" class="practice-mobile-view">
          <header class="hero practice-mobile-hero">
            <div class="hero__content">
              <p class="eyebrow">手機無限練習</p>
              <h1>章節練習快選</h1>
              <p class="hero__lead">
                先選章節，再直接進入題型練習。手機版會優先讀取上次的出題紀錄，沒有紀錄時會自動出題，方便老師課堂切換與學生自己刷題。
              </p>
              <div class="hero__quicklinks">
                <a class="ghost-link" href="practice-bank.html">返回練習總覽</a>
                <a class="ghost-link" href="index.html">回首頁</a>
              </div>
            </div>
          </header>

          <section class="panel practice-mobile-select-panel">
            <h2>快速篩選</h2>
            <label class="field">
              <span>顯示模式</span>
              <select id="mobileLayoutModeSelect">
                <option value="focus">模式 1：題目放大</option>
                <option value="default">模式 2：目前版面</option>
              </select>
            </label>
            <label class="field">
              <span>學習階段</span>
              <select id="mobileGradeFilter"></select>
            </label>
            <label class="field">
              <span>關鍵字搜尋</span>
              <input id="mobileKeywordInput" type="search" placeholder="可搜章節、題型、標籤" />
            </label>
            <button id="mobileResetButton" class="ghost-button" type="button">清除篩選</button>
          </section>

          <section class="panel practice-mobile-chapter-panel">
            <div class="practice-mobile-list-panel__header">
              <div>
                <p class="summary-label">章節清單</p>
                <h2>可練習章節</h2>
              </div>
              <p id="mobileChapterCount" class="summary-count"></p>
            </div>
            <div id="mobileChapterList" class="practice-mobile-list"></div>
          </section>
        </section>

        <section id="mobilePracticeView" class="practice-mobile-view is-hidden">
          <section id="mobilePracticePlayer" class="panel practice-mobile-player">
            <div class="practice-mobile-player__topbar practice-mobile-player__nav-strip">
              <div class="practice-mobile-player__nav-slot practice-mobile-player__nav-slot--start">
                <button
                  id="mobilePrevChapterButton"
                  type="button"
                  class="ghost-button practice-mobile-mode-default-only"
                >
                  上一章
                </button>
                <button
                  id="mobileMode2PrevChapterButton"
                  type="button"
                  class="ghost-button practice-mobile-mode-focus-only is-hidden"
                  aria-label="上一章"
                >
                  上一章
                </button>
              </div>
              <button id="mobileBackButton" type="button" class="ghost-button practice-mobile-player__back-button">
                回上一頁
              </button>
              <div class="practice-mobile-player__nav-slot practice-mobile-player__nav-slot--end">
                <button
                  id="mobileNextChapterButton"
                  type="button"
                  class="ghost-button practice-mobile-mode-default-only"
                >
                  下一章
                </button>
                <button
                  id="mobileMode2NextChapterButton"
                  type="button"
                  class="ghost-button practice-mobile-mode-focus-only is-hidden"
                  aria-label="下一章"
                >
                  下一章
                </button>
              </div>
            </div>

            <div class="practice-mobile-player__topbar-text">
              <p class="summary-label">目前章節</p>
              <h2 id="mobileChapterTitle">章節</h2>
            </div>

            <div id="mobileCompactActions" class="is-hidden"></div>

            <div id="mobileDefaultTopActions" class="is-hidden"></div>

            <div class="practice-mobile-player__header practice-mobile-player__header--nav">
              <div class="practice-mobile-player__nav-slot">
                <button
                  id="mobilePrevPracticeButton"
                  type="button"
                  class="ghost-button practice-mobile-mode-default-only"
                >
                  上一題型
                </button>
                <button
                  id="mobileMode2PrevPracticeButton"
                  type="button"
                  class="ghost-button practice-mobile-mode-focus-only is-hidden"
                  aria-label="上一題型"
                >
                  上一題型
                </button>
              </div>
              <div class="practice-mobile-player__header-main">
                <p class="summary-label">目前題型</p>
                <h2 id="mobilePracticeTitle">尚未選擇題型</h2>
                <p id="mobilePracticeProgress" class="summary-count practice-mobile-player__progress-inline"></p>
              </div>
              <div class="practice-mobile-player__nav-slot">
                <button
                  id="mobileNextPracticeButton"
                  type="button"
                  class="ghost-button practice-mobile-mode-default-only"
                >
                  下一題型
                </button>
                <button
                  id="mobileMode2NextPracticeButton"
                  type="button"
                  class="ghost-button practice-mobile-mode-focus-only is-hidden"
                  aria-label="下一題型"
                >
                  下一題型
                </button>
              </div>
            </div>

            <div id="mobilePracticeMeta" class="meta-row"></div>
            <p id="mobilePracticeHint" class="detail-note practice-mobile-note">題目會自動載入。</p>

            <div
              id="mobileDefaultBottomActions"
              class="interactive-actions interactive-actions--stacked practice-mobile-player__actions"
            >
              <div id="mobileQuestionPagerRow" class="interactive-actions__row interactive-actions__row--split">
                <button id="mobilePrevQuestionButton" type="button" class="ghost-button">上一題</button>
                <button id="mobileNextQuestionButton" type="button" class="ghost-button">下一題</button>
              </div>
              <div class="interactive-actions__row interactive-actions__row--triple">
                <button id="mobileSummaryButton" type="button" class="ghost-button">簡答</button>
                <button id="mobileDetailButton" type="button" class="ghost-button">詳解</button>
                <button id="mobileRegenerateButton" type="button" class="ghost-button">重新出題</button>
              </div>
            </div>

            <div
              id="mobileFocusBottomActions"
              class="interactive-actions interactive-actions__row--focus-five is-hidden"
            >
              <button id="mobileMode2PrevQuestionButton" type="button" class="ghost-button">上一題</button>
              <button id="mobileMode2SummaryButton" type="button" class="ghost-button">簡答</button>
              <button id="mobileMode2DetailButton" type="button" class="ghost-button">詳解</button>
              <button id="mobileMode2RegenerateButton" type="button" class="ghost-button">重出</button>
              <button id="mobileMode2NextQuestionButton" type="button" class="ghost-button">下一題</button>
            </div>

            <div id="mobileQuestionOutput" class="interactive-output">題目載入中。</div>
            <div class="interactive-answer-panels">
              <div id="mobileSummaryOutput" class="interactive-output is-hidden"></div>
              <div id="mobileDetailOutput" class="interactive-output is-hidden"></div>
            </div>
          </section>

          <section id="mobilePracticeListPanel" class="panel practice-mobile-list-panel">
            <div class="practice-mobile-list-panel__header">
              <div>
                <p class="summary-label">本章題型</p>
                <h2 id="mobileListTitle">章節題型</h2>
              </div>
              <p id="mobileListCount" class="summary-count"></p>
            </div>
            <div id="mobilePracticeList" class="practice-mobile-list"></div>
          </section>
        </section>
      </main>
    </div>

    <script defer src="formulas.js"></script>
    <script defer src="data/formula-content.js?v=20260423-abs-count-layout-v4"></script>

    <script defer src="data/formula-calculators.js"></script>
    <script defer src="data/formula-practice-assignments.js?v=20260627-fix-generatorkeys-v1"></script>
    <script defer src="data/formula-practice.js?v=20260620-runtime-main-v1"></script>
    <script defer src="data/practice-generators/shared-legacy-bundle.js?v=20260619-e5-stage-fix-v2"></script>
    <script defer src="data/practice-generator-bootstrap.js?v=20260619-e5-cutover-v1"></script>
    <script defer src="data/practice-generator-bundles.js?v=20260624-nullfix-v1"></script>
    <script defer src="data/practice-generator-loader.js?v=20260619-e5-force-bundle-v3"></script>
    <script defer src="data/practice-generators/e5.js?v=20260628-e5-real-bundle-v7"></script>
    <script defer src="data/practice-generators/e6.js?v=20260628-e6-real-bundle-v3"></script>
    <script defer src="data/practice-generators/j1.js?v=20260622-j133-file-v1"></script>
    <script defer src="data/practice-generators/j2.js?v=20260628-j2-real-bundle-v2"></script>
    <script defer src="data/practice-generators/j3.js?v=20260628-j3-fix-v2"></script>
    <script defer src="data/practice-generators/j4.js?v=20260622-j44-quad-v1"></script>
    <script defer src="data/practice-generators/j5.js?v=20260619-j5-real-bundle-v1"></script>
    <script defer src="data/practice-generators/j6.js?v=20260629-j6-stats-prob-v1"></script>
    <script defer src="data/practice-generators/s1.js?v=20260630-s1-3-functions-v1"></script>
    <script defer src="data/practice-generators/s2.js?v=20260630-s2-1-sequences-v1"></script>
    <script defer src="data/practice-generators/s3.js?v=20260619-s3-real-bundle-v1"></script>
    <script defer src="data/practice-generators/s4.js?v=20260624-s4-44new-v1"></script>
    <script defer src="data/practice-generator-loader.js?v=20260619-e5-force-bundle-v3"></script>
    <script defer src="formula-data.js?v=20260616-e425-split-v1"></script>
    <script defer src="chapter-overviews.js?v=20260507-main-theme-layer-v2"></script>
    <script defer src="chapter-closings.js?v=20260507-main-theme-layer-v2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="formula-core.js?v=20260619-e5-fingerprint-v5"></script>
    <script defer src="practice-mobile/practice-mobile.js?v=20260622-j123-binding-fix-v2"></script>
    <script defer src="pwa.js"></script>
  </body>
</html>
