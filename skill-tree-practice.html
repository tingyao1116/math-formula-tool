  </head>
  <body class="ability-practice-page">
    <div class="page-shell">
      <header class="hero">
        <div class="hero__content">
          <p class="eyebrow">章節排序技能樹</p>
          <h1>技能樹練習</h1>
          <p class="hero__lead">這一頁保留自由選擇。學生可以自己選想熟悉的技能，老師也可以直接指定某個技能節點開始練習。</p>
          <div class="hero__quicklinks">
            <a class="ghost-link" href="index.html">回首頁</a>
            <a class="ghost-link" href="practice-bank.html">題型總覽</a>
            <a class="ghost-link" href="practice-mobile.html">手機版練習</a>
          </div>
        </div>
        <div class="hero__panel">
          <h2>目前版本</h2>
          <ul id="skillTreeAuditList"></ul>
        </div>
      </header>

      <main class="layout ability-practice-layout">
        <aside class="sidebar ability-practice-sidebar">
          <section class="panel">
            <div class="skill-tree-toolbar">
              <h2>技能樹</h2>
              <button id="treeToggleButton" class="ghost-button" type="button">隱藏技能樹</button>
            </div>
            <div id="masteryLegend" class="mastery-legend"></div>
            <div id="skillTreeMap" class="ability-map"></div>
          </section>
        </aside>

        <section class="content ability-practice-content">
          <section class="panel summary-panel ability-summary-panel">
            <div>
              <p class="summary-label">目前技能</p>
              <h2 id="skillTitle">請先選一個技能</h2>
            </div>
            <p id="skillStatus" class="summary-count"></p>
          </section>

          <section class="panel ability-detail-panel">
            <div class="ability-detail-panel__header">
              <div>
                <p id="skillChapter" class="ability-mainline-label"></p>
                <p id="skillSummary" class="ability-detail-text"></p>
              </div>
              <div class="ability-progress-card">
                <div class="ability-progress-card__label">熟悉度</div>
                <div id="skillMasteryLabel" class="ability-progress-card__value">未開始</div>
                <div class="ability-progress-bar">
                  <div id="skillMasteryBar" class="ability-progress-bar__fill"></div>
                </div>
              </div>
            </div>

            <div class="ability-meta-grid skill-tree-meta-grid">
              <div class="ability-meta-box">
                <h3>對應題型</h3>
                <div id="skillPracticeTags" class="ability-tag-list"></div>
              </div>
              <div class="ability-meta-box">
                <h3>前置技能</h3>
                <div id="skillPrerequisites" class="ability-tag-list"></div>
              </div>
              <div class="ability-meta-box">
                <h3>下一步</h3>
                <div id="skillNextSteps" class="ability-tag-list"></div>
              </div>
            </div>
          </section>

          <section class="panel ability-session-panel">
            <div class="ability-session-panel__header">
              <div>
                <h2>直接練習</h2>
                <p id="sessionHint" class="ability-detail-text">選技能後就可以開始。</p>
              </div>
              <div class="ability-session-actions">
                <button id="startPracticeButton" class="ghost-button" type="button">開始練習</button>
                <button id="newQuestionButton" class="ghost-button" type="button" disabled>換一題</button>
              </div>
            </div>

            <div id="sessionCard" class="ability-session-card is-empty">
              <p>左邊技能樹可直接選技能，也可以按節點旁的「練習」。</p>
            </div>

            <div id="feedbackPanel" class="ability-feedback-panel" hidden></div>
            <div id="mistakeTagPanel" class="ability-mistake-panel" hidden></div>
            <div id="recommendationPanel" class="ability-recommendation-panel" hidden></div>
          </section>
        </section>
      </main>
    </div>
